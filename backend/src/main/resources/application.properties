spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KCK_JWK_URL:http://localhost:9090}/realms/${KCK_REALM:spring-boot-realm-tingeso}/protocol/openid-connect/certs
jwt.auth.convert.principle-attribute=preferred_username
jwt.auth.convert.resource-id=spring-client-api-rest
logging.level.org.keycloak=DEBUG
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tingeso_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect