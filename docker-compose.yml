version: "3.8"
services:
  postgres:
    image: postgres:15
    container_name: tingeso-postgres
    environment:
      - POSTGRES_DB=tingeso_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: tingeso-keycloak
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/tingeso_db
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=postgres
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HOSTNAME_URL=http://localhost:9090
      - KC_HOSTNAME_ADMIN_URL=http://localhost:9090
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_ENABLED=true
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "9090:8080"
    depends_on:
      - postgres
    networks:
      - backend-network

  backend1:
    image: lucianoxhdx/tingeso-backend:latest
    restart: on-failure
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=tingeso_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - KCK_JWK_URL=http://keycloak:8080
      - KCK_URL=http://localhost:9090
      - KCK_REALM=spring-boot-realm-tingeso

    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - postgres
      - keycloak
    networks:
      - backend-network

  backend2:
    image: lucianoxhdx/tingeso-backend:latest
    restart: on-failure
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=tingeso_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - KCK_JWK_URL=http://keycloak:8080
      - KCK_URL=http://localhost:9090
      - KCK_REALM=spring-boot-realm-tingeso
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - postgres
      - keycloak
    networks:
      - backend-network

  backend3:
    image: lucianoxhdx/tingeso-backend:latest
    restart: on-failure
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=tingeso_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - KCK_JWK_URL=http://keycloak:8080
      - KCK_URL=http://localhost:9090
      - KCK_REALM=spring-boot-realm-tingeso
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - postgres
      - keycloak
    networks:
      - backend-network

  nginx-backend:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx-backend.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - backend-network
      - frontend-network

  frontend1:
    image: lucianoxhdx/tingeso-frontend:latest
    networks:
      - frontend-network
  frontend2:
    image: lucianoxhdx/tingeso-frontend:latest
    networks:
      - frontend-network
  frontend3:
    image: lucianoxhdx/tingeso-frontend:latest
    networks:
      - frontend-network

  nginx-frontend:
    image: nginx:latest
    ports:
      - "8070:8070"
    volumes:
      - ./nginx-frontend.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend1
      - frontend2
      - frontend3
      - nginx-backend
    networks:
      - frontend-network
      - backend-network

networks:
  frontend-network:
  backend-network:

volumes:
  postgres-data: